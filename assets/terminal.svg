<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" role="img" aria-labelledby="title desc">
<title id="title">Developer workspace</title>
<desc id="desc">Emandoyesus builds web apps, mobile experiences, and APIs with a focus on type safety and clean architecture.</desc>
<style>
@keyframes reveal{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:0}}
.row{animation:reveal .6s ease-out both}.two{animation-delay:.4s}.three{animation-delay:.8s}.four{animation-delay:1.2s}.five{animation-delay:1.6s}.cursor{animation:blink 1.4s step-end infinite}
@media(prefers-reduced-motion:reduce){.row,.cursor{animation:none}}
</style>
<rect x="1" y="1" width="438" height="248" rx="14" fill="#0d1524" stroke="#24384d"/>
<path d="M1 42H439" stroke="#24384d"/>
<circle cx="21" cy="22" r="4" fill="#fb7185"/><circle cx="37" cy="22" r="4" fill="#fbbf24"/><circle cx="53" cy="22" r="4" fill="#34d399"/>
<text x="80" y="26" font-family="monospace" font-size="11" fill="#94a3b8">emandoyesus / workspace</text>
<g font-family="monospace" font-size="13">
<text class="row" x="22" y="76" fill="#67e8f9">$ cat developer.json</text>
<text class="row two" x="22" y="107" fill="#cbd5e1">  "focus": "web + mobile",</text>
<text class="row three" x="22" y="136" fill="#cbd5e1">  "backend": "Node.js + PostgreSQL",</text>
<text class="row four" x="22" y="165" fill="#cbd5e1">  "approach": "build with purpose"</text>
<text class="row five" x="22" y="211" fill="#34d399">$ ready to build</text>
</g><rect class="cursor" x="153" y="199" width="8" height="15" fill="#67e8f9"/>
</svg>
