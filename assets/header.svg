<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" role="img" aria-labelledby="title desc">
<title id="title">From interface to infrastructure</title>
<desc id="desc">An abstract banner linking a user interface, an API, and a database.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1524"/><stop offset="1" stop-color="#123044"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#67e8f9" stroke-opacity=".07"/></pattern>
</defs>
<style>
@keyframes drift{from{stroke-dashoffset:0}to{stroke-dashoffset:-64}}
.flow{stroke-dasharray:6 10;animation:drift 4s linear infinite}
@media(prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
<rect width="900" height="120" rx="16" fill="url(#bg)"/>
<rect width="900" height="120" rx="16" fill="url(#grid)"/>
<g fill="none" stroke="#22d3ee" stroke-width="2" opacity=".55">
  <path class="flow" d="M285 60H395"/>
  <path class="flow" d="M505 60H615"/>
</g>
<g fill="#102438" stroke="#22d3ee" stroke-opacity=".45">
  <rect x="175" y="34" width="110" height="52" rx="10"/>
  <rect x="395" y="34" width="110" height="52" rx="10"/>
  <rect x="615" y="34" width="110" height="52" rx="10"/>
</g>
<g fill="#67e8f9" font-family="system-ui,sans-serif" font-size="12" font-weight="600" letter-spacing="2" text-anchor="middle">
  <text x="230" y="66">UI</text>
  <text x="450" y="66">API</text>
  <text x="670" y="66">DATA</text>
</g>
<g fill="none" stroke="#67e8f9" opacity=".09"><circle cx="820" cy="60" r="84"/><circle cx="820" cy="60" r="58"/><circle cx="820" cy="60" r="32"/></g>
</svg>
