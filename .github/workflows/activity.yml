name: Refresh profile activity
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - scripts/activity.py
      - .github/workflows/activity.yml
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: |
          gh api graphql -f login="$PROFILE_OWNER" -f query='query($login:String!){user(login:$login){starredRepositories{totalCount} contributionsCollection{contributionCalendar{totalContributions weeks{contributionDays{date weekday contributionCount contributionLevel}}}}}}' > /tmp/calendar.json
          python3 scripts/activity.py < /tmp/calendar.json
      - name: Save refreshed grid
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg assets/stars-given.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh contribution activity'
            git push
          fi
